name: Publish

# Default permissions are least-privilege; the publish job elevates to
# contents: write / packages: write below.
permissions:
  contents: read

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run tests
        run: ./gradlew --no-daemon build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Tag pushes cannot depend on the separate Test workflow, so tests are
    # re-run here and the publish job is gated on them succeeding. A failure
    # here costs no Central deployment quota.
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check the tag matches the build version
        # Every version here is a hardcoded literal in build.gradle, and this workflow fires
        # on tags rather than on the build. Nothing connects the two, so tagging v0.1.4 with
        # version still at 0.1.3 does not fail -- it publishes 0.1.3's bytes under a tag that
        # claims to be 0.1.4, and the GitHub Packages step's `continue-on-error` swallows the
        # duplicate that Central would have rejected. The result is a release whose name and
        # contents disagree, discovered later or not at all.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          declared="$(grep -E "^version[[:space:]]*=" build.gradle | head -1 | cut -d"'" -f2)"
          echo "tag=$tag declared version=$declared"
          if [ "$tag" != "v$declared" ]; then
            echo "::error::Tag $tag does not match build.gradle version '$declared'."
            echo "Bump version in build.gradle to $tag, or retag, before publishing."
            exit 1
          fi

      - name: Publish to GitHub Packages
        # continue-on-error is deliberate. GitHub Packages answers 409 when a
        # version already exists, which is exactly what happens when a release
        # is re-run to fix a Central failure: the mirror got the artifacts on the
        # first attempt and Central rejected them. Since Central is the
        # authoritative channel and the mirror is a fallback, a mirror conflict
        # must not block the publish that actually matters. Failures here still
        # show up in the step log; they just do not stop the job.
        #
        # No signing credentials are passed on purpose -- Central requires
        # signatures, the mirror does not, and this keeps the two unsigned
        # artifacts from being confused with the signed ones.
        continue-on-error: true
        run: ./gradlew --no-daemon publishMavenPublicationToGitHubPackagesRepository
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Central
        # Uploads via the Central Portal publisher API (com.gradleup.nmcp) and
        # auto-releases after validation. The legacy OSSRH staging API stopped
        # accepting deployments in 2026.
        #
        # Central requires a GPG signature on every artifact *and* on the Gradle
        # module metadata, so both the key and its passphrase are needed here.
        # build.gradle signs the publication whenever SIGNING_KEY and
        # SIGNING_PASSWORD are both set, and skips signing otherwise -- which is
        # why the GitHub Packages step above deliberately does not receive them.
        run: ./gradlew --no-daemon nmcpPublishAggregationToCentralPortal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}

