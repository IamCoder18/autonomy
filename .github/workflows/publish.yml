name: Publish

# Default permissions are least-privilege; the publish job elevates to
# contents: write / packages: write below.
permissions:
  contents: read

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run tests
        run: ./gradlew --no-daemon build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Tag pushes cannot depend on the separate Test workflow, so tests are
    # re-run here and the publish job is gated on them succeeding. A failure
    # here costs no Central deployment quota.
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Publish to GitHub Packages
        run: ./gradlew --no-daemon publishMavenPublicationToGitHubPackagesRepository
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Central
        # Uploads via the Central Portal publisher API (com.gradleup.nmcp) and
        # auto-releases after validation. The legacy OSSRH staging API stopped
        # accepting deployments in 2026.
        #
        # Central requires a GPG signature on every artifact *and* on the Gradle
        # module metadata, so both the key and its passphrase are needed here.
        # build.gradle signs the publication whenever SIGNING_KEY and
        # SIGNING_PASSWORD are both set, and skips signing otherwise -- which is
        # why the GitHub Packages step above deliberately does not receive them.
        run: ./gradlew --no-daemon nmcpPublishAggregationToCentralPortal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}

