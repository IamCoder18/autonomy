# Autonomy — local Gradle config
#
# Coordinates live in build.gradle. Releases are published to Maven Central
# (via the Central Portal API) and to GitHub Packages; see CONTRIBUTING.md for
# the release procedure.
#
# To publish you need a GitHub Personal Access Token (classic) with the
# `write:packages` scope. Generate one at:
#   https://github.com/settings/tokens/new
#
# The GitHub Packages repository URL is configured in build.gradle. If you fork
# Autonomy and publish from a different GitHub account, update that URL (and the
# POM SCM fields) accordingly.
#
# Then uncomment and fill in the values below, or set GITHUB_TOKEN and
# GITHUB_ACTOR in the environment before running gradle publish:
#
# gpr.user=<your-github-username>
# gpr.key=ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#
# In CI these are wired to the GitHub Actions secret GITHUB_TOKEN via the
# publish workflow.
#
# To publish to Maven Central you also need a user token from
# https://central.sonatype.com/usertoken and a GPG key for signing. The
# armored PGP private key is multi-line and cannot live in this .properties
# file; pass it via the SIGNING_KEY environment variable (the passphrase is
# single-line and can go in signing.password below if you prefer).
#
# In CI these are wired to the GitHub Actions secrets SONATYPE_USERNAME,
# SONATYPE_PASSWORD, GPG_PRIVATE_KEY, and GPG_PASSPHRASE via the publish
# workflow.
#
# sonatypeUsername=<token-username-from-central.sonatype.com>
# sonatypePassword=<token-secret>
# signing.password=<GPG passphrase>

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
