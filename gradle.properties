# Autonomy — local Gradle config
#
# Coordinates live in build.gradle. Publishing targets GitHub Packages only;
# see CONTRIBUTING.md for the release procedure.
#
# To publish you need a GitHub Personal Access Token (classic) with the
# `write:packages` scope. Generate one at:
#   https://github.com/settings/tokens/new
#
# The GitHub Packages repository URL is configured in build.gradle. If you fork
# Autonomy and publish from a different GitHub account, update that URL (and the
# POM SCM fields) accordingly.
#
# Then uncomment and fill in the values below, or set GITHUB_TOKEN and
# GITHUB_ACTOR in the environment before running gradle publish:
#
# gpr.user=<your-github-username>
# gpr.key=ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#
# In CI these are wired to the GitHub Actions secret GITHUB_TOKEN via the
# publish workflow.

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
